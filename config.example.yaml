# Single agent (backwards compatible):
wecom:
  name: "my-agent"  # optional label
  corp_id: "your_corp_id"
  agent_id: 1000002
  secret: "your_agent_secret"
  token: "callback_verification_token"
  encoding_aes_key: "callback_encoding_aes_key_43chars"
  mode: "relay"  # "relay" (poll self-hosted relay) or "callback" (direct webhook)
  relay_url: "http://<elastic-ip>:8443"  # required for relay mode; your self-hosted relay
  relay_token: "your_relay_fetch_token"  # required for relay mode; matches the relay's RELAY_FETCH_TOKEN
  relay_poll_interval_seconds: 5.0  # only used in relay mode
  proxy: ""  # optional: SOCKS5 proxy for fixed outbound IP, e.g. "socks5://127.0.0.1:1080"

# Multiple agents (each gets its own WeCom bot + executor):
# wecom:
#   - name: "coding"
#     corp_id: "your_corp_id"
#     agent_id: 1000002
#     secret: "agent_secret_1"
#     token: "token_1"
#     encoding_aes_key: "aes_key_1"
#     mode: "relay"
#     relay_url: "http://<elastic-ip>:8443"
#     relay_token: "your_relay_fetch_token"   # same relay can serve both agents
#   - name: "review"
#     corp_id: "your_corp_id"
#     agent_id: 1000003
#     secret: "agent_secret_2"
#     token: "token_2"
#     encoding_aes_key: "aes_key_2"
#     mode: "relay"
#     relay_url: "http://<elastic-ip>:8443"
#     relay_token: "your_relay_fetch_token"

agent:
  claude_command: "claude"           # path to Claude Code CLI binary
  default_working_dir: "/path/to/your/projects"  # where Claude Code runs — your project directory (NOT the lobster-cc directory)
  allowed_tools: []                  # empty = Claude Code defaults. See: https://docs.anthropic.com/en/docs/claude-code/settings
  model: ""                          # empty = Claude Code default model. e.g. "claude-sonnet-4-20250514"
  permission_mode: ""                # empty = default. Options: "default", "acceptEdits", "bypassPermissions"
  task_timeout_seconds: 600          # max seconds per task (600 = 10 min, recommended: 1800 for complex tasks)
  max_output_length: 4000

server:
  host: "0.0.0.0"
  port: 8080

storage:
  db_path: "./remote_control.db"

notifications:
  progress_interval_seconds: 30

# Dashboard — read-only web UI with lobster animation
dashboard:
  enabled: false                         # set true to enable
  password: ""                           # required — login password
  secret: "change-me-to-random-string"   # HMAC signing key for auth cookies
